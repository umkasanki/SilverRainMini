name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26   # the app needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Test
        run: make test
